name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build executable
        run: pyinstaller --noconfirm --onefile --windowed --name "NetScope Scanner" --icon "assets/netscope.ico" --add-data "assets/netscope.ico;assets" main.py

      - name: Sign Windows executable
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX_B64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_B64)) {
            Write-Host "Code signing certificate not configured; publishing unsigned executable."
            exit 0
          }

          $certPath = Join-Path $env:RUNNER_TEMP "netscope-codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe was not found on the GitHub Actions runner."
          }

          & $signtool.FullName sign /f $certPath /p "$env:WINDOWS_CODESIGN_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist/NetScope Scanner.exe"

      - name: Rename release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist/NetScope Scanner.exe" "release/NetScope-Scanner-${{ github.ref_name }}-Windows.exe"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: NetScope Scanner ${{ github.ref_name }}
          files: release/NetScope-Scanner-${{ github.ref_name }}-Windows.exe
          body: |
            NetScope Scanner defensive network scanner for authorized environments.

            Included:
            - Windows executable
            - Service and version detection
            - CPE/CVE matching with NVD and CISA KEV enrichment
            - PDF, Excel and CSV exports

            Use only on networks and systems you own or are explicitly authorized to assess.
